* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { overflow-x: clip; background: var(--bg); color: var(--text); font: 400 1rem/1.6 var(--body); padding-bottom: env(safe-area-inset-bottom, 0); }
:focus-visible { outline: 2px solid var(--lilac); outline-offset: 3px; }

/* ---------- Banner ---------- */
.cover { position: relative; height: clamp(172px, 36vw, 440px); overflow: hidden; background: #8c8fd6; }
.cover img { width: 100%; height: 100%; object-fit: cover; object-position: center 65%; display: block; }
.cover::after { content: ""; position: absolute; inset: 70% 0 0; background: linear-gradient(to bottom, transparent, var(--bg)); }

/* ---------- Estrutura ---------- */
.page { width: min(100% - 2rem, 1040px); margin-inline: auto; display: grid; gap: 2.5rem; grid-template-columns: 1fr; padding-bottom: 3rem; }
aside { margin-top: -34px; position: relative; z-index: 1; }
@media (min-width: 880px) {
  .page { grid-template-columns: 290px 1fr; gap: 3.5rem; }
  aside { position: sticky; top: 1.5rem; align-self: start; margin-top: -110px; }
}

/* ---------- Perfil ---------- */
.pfp { width: 112px; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--surface);
  box-shadow: 0 0 0 5px var(--bg), 0 0 0 6px var(--neon); }
.pfp img { width: 100%; height: 100%; object-fit: cover; display: block; }
@media (min-width: 880px) { .pfp { width: 100%; max-width: 230px; } }
aside h1 { font: 700 clamp(2.2rem, 8vw, 2.9rem)/.98 var(--display); letter-spacing: -.01em; margin: 1.6rem 0 .9rem; text-wrap: pretty; }
.intro { color: var(--muted); max-width: 46ch; }
.total { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .92rem; }
.total b { color: var(--lilac); font-weight: 600; }

/* ---------- Formulário ---------- */
h2 { font: 700 1.9rem/1.1 var(--display); margin-bottom: 1.1rem; }
.form { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.4rem 1.2rem; }
@media (min-width: 640px) { .form { padding: 1.8rem; } }
.field { margin-bottom: 1.6rem; }
.ribbon { display: inline-flex; align-items: center; gap: .6rem; background: var(--ribbon); color: var(--ink);
  font: 700 1.12rem/1 var(--display); padding: .5rem .85rem; border-radius: 4px; margin-bottom: .75rem; }
.ribbon::before, .ribbon::after { content: ""; width: 12px; height: 24px; flex: none; background: var(--pin) center / contain no-repeat; margin-block: -6px; transform: rotate(-18deg); }
.ribbon::after { transform: scaleX(-1) rotate(-18deg); }
.hourglass { display: inline-block; width: .72em; height: .72em; vertical-align: -.02em; margin-left: .15em; color: var(--lilac); }
.ribbon small { font: 500 .78rem var(--body); opacity: .7; }

input[type="text"], input[type="password"], textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 8px; padding: .8rem .95rem; font: inherit; font-size: 1rem; transition: border-color .15s; }
input::placeholder, textarea::placeholder { color: #71717a; }
input:focus, textarea:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 0 1px var(--neon); }
textarea { min-height: 130px; resize: vertical; }
.counter { text-align: right; font-size: .85rem; color: var(--muted); margin-top: .35rem; }
.counter.warn { color: #fbbf24; } .counter.max { color: #f87171; }

.chips { display: flex; flex-wrap: wrap; gap: .5rem; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; padding: .5rem .95rem; border-radius: 6px; cursor: pointer; border: 1px solid var(--line);
  color: var(--text); font-weight: 500; transition: background .15s, border-color .15s; user-select: none; }
.chip span:hover { border-color: var(--lilac); }
.chip input:checked + span { background: var(--lilac); border-color: var(--lilac); color: var(--ink); font-weight: 600; }
.chip input:focus-visible + span { outline: 2px solid var(--lilac); outline-offset: 3px; }

.send { position: relative; filter: drop-shadow(4px 4px 0 rgba(168, 85, 247, .5)); transition: filter .12s, transform .12s; }
.send:active { transform: translate(2px, 2px); filter: drop-shadow(2px 2px 0 rgba(168, 85, 247, .5)); }
.btn, .half {
  display: block; width: 100%; border: 0; padding: 1.05rem 1.4rem; background: var(--lilac); color: var(--ink);
  font: 700 1.4rem/1.2 var(--display); letter-spacing: .01em; text-align: center;
  outline: 1px dashed rgba(46, 16, 101, .5); outline-offset: -11px;
  -webkit-mask: radial-gradient(circle 9px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 9px at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat, radial-gradient(circle 9px at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
}
.btn { cursor: pointer; transition: background .15s; }
.btn:hover { background: var(--ribbon); }
.btn:disabled { cursor: progress; }
.cut { position: absolute; inset: 0; display: none; pointer-events: none; }
.half { position: absolute; inset: 0; }
.half.a { clip-path: polygon(0 0, 58% 0, 42% 100%, 0 100%); animation: partA 1.1s ease-in-out both; }
.half.b { clip-path: polygon(58% 0, 100% 0, 100% 100%, 42% 100%); animation: partB 1.1s ease-in-out both; }
.slash { position: absolute; left: 0; top: -6px; width: 100%; height: calc(100% + 12px); overflow: visible; animation: slash 1.1s ease-out both; }
.slash line { stroke: #fff; stroke-width: 2px; }
.send.cutting .btn { visibility: hidden; }
.send.cutting .cut { display: block; }
.send.done .btn { background: var(--ink); color: var(--ribbon); outline-color: rgba(233, 213, 255, .5); }
@keyframes slash { 0% { clip-path: inset(0 0 100% 0); opacity: 1; } 20% { clip-path: inset(0); opacity: 1; } 55% { opacity: 1; } 100% { clip-path: inset(0); opacity: 0; } }
@keyframes partA { 0%, 18% { transform: none; } 38%, 62% { transform: translate(-16px, -3px) rotate(-1.4deg); } 100% { transform: none; } }
@keyframes partB { 0%, 18% { transform: none; } 38%, 62% { transform: translate(16px, 3px) rotate(1.4deg); } 100% { transform: none; } }
.error { color: #f87171; font-size: .9rem; min-height: 1.3em; margin: -.9rem 0 .8rem; }

/* ---------- Mural ---------- */
.mural { margin-top: 3rem; }
.wall { columns: 2 250px; column-gap: .9rem; }
.note { break-inside: avoid; margin-bottom: .9rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1.1rem; }
.note.fresh { animation: seal .7s cubic-bezier(.2,1.3,.4,1); border-color: var(--lilac); }
@keyframes seal { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.note p { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 1rem; }
.note footer { display: flex; justify-content: space-between; align-items: baseline; gap: .6rem; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: .7rem; }
.who { font-weight: 600; overflow-wrap: anywhere; }
.who.anon { color: var(--muted); font-weight: 400; font-style: italic; }
.tag { font-size: .82rem; font-weight: 600; color: var(--c); display: inline-flex; align-items: center; gap: .4rem; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.note time { flex-basis: 100%; font-size: .8rem; color: var(--muted); }
.t-Instagram { --c: #f472b6; } .t-TikTok { --c: #22d3ee; } .t-Discord { --c: #818cf8; }
.t-Vida-real { --c: #4ade80; } .t-Outro { --c: #fbbf24; }

.toast { position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0)); z-index: 10; transform: translate(-50%, 160%);
  background: var(--ribbon); color: var(--ink); font-weight: 600; padding: .75rem 1.2rem; border-radius: 8px; max-width: 90vw; transition: transform .3s; }
.toast.show { transform: translate(-50%, 0); }

/* ---------- Supabase / admin ---------- */
.wall-msg { column-span: all; color: var(--muted); padding: 1rem 0; }
aside h1 { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.note { position: relative; }
.is-admin .note p { padding-right: 3rem; }
.del { position: absolute; top: .65rem; right: .65rem; display: inline-flex; align-items: center; gap: .4rem; min-height: 34px; padding: 0 .55rem;
  border-radius: 6px; background: transparent; color: #f87171; border: 1px solid rgba(248,113,113,.45); cursor: pointer; font: 600 .8rem var(--body); }
.del svg { width: 16px; height: 16px; }
.del.armed { background: #f87171; color: #1a1a1f; }
.del.armed::after { content: "Apagar?"; }
.del:disabled { opacity: .5; cursor: progress; }
.admin-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; border: 1px dashed var(--lilac); border-radius: 8px;
  padding: .55rem .9rem; margin-bottom: 1rem; font-size: .9rem; color: var(--lilac); }
.admin-bar[hidden] { display: none; }
.admin-bar button { background: none; border: 0; color: var(--text); text-decoration: underline; cursor: pointer; font: inherit; }
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0,0,0,.7); padding: 1rem; }
.modal[hidden] { display: none; }
.modal-box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.4rem; width: min(100%, 360px); }
.modal-box h3 { font: 700 1.6rem/1.1 var(--display); margin-bottom: 1rem; }
.modal .error { margin: .6rem 0 0; }
.modal-actions { display: flex; gap: .6rem; margin-top: 1rem; justify-content: flex-end; }
.modal-actions button { border-radius: 8px; padding: .65rem 1.1rem; font: 600 .95rem var(--body); cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--text); }
.modal-actions .solid { background: var(--lilac); color: var(--ink); border-color: var(--lilac); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
"use strict";

/* =========================================================
   1) SUPABASE (banco na nuvem)
   A chave "publishable/anon" pode ficar no navegador: ela só faz o que as
   regras (RLS) do banco permitem. Apagar recados NÃO é liberado para ela:
   só passa pelas funções admin_ok / apagar_recado, que conferem a senha no servidor.

   >>> RODE ESTE SQL UMA VEZ em Supabase > SQL Editor > New query <<<

   create table if not exists public.recados (
     id bigint generated always as identity primary key,
     created_at timestamptz not null default now(),
     nome text, origem text, mensagem text not null
   );
   alter table public.recados enable row level security;

   drop policy if exists "ler recados" on public.recados;
   create policy "ler recados" on public.recados for select to anon using (true);

   drop policy if exists "enviar recados" on public.recados;
   create policy "enviar recados" on public.recados for insert to anon
     with check (char_length(mensagem) between 1 and 280
       and char_length(coalesce(nome, '')) <= 40
       and origem in ('Instagram','TikTok','Discord','Vida real','Outro'));
   -- sem policy de DELETE: ninguém apaga direto pelo navegador

   create or replace function public.admin_ok(p_senha text) returns boolean
   language sql security definer set search_path = public
   as $$ select p_senha = 'admin123' $$;

   create or replace function public.apagar_recado(p_id text, p_senha text) returns boolean
   language plpgsql security definer set search_path = public
   as $$ begin
     if p_senha is distinct from 'admin123' then return false; end if;
     delete from public.recados where id::text = p_id;
     return true;
   end $$;

   revoke all on function public.admin_ok(text), public.apagar_recado(text, text) from public;
   grant execute on function public.admin_ok(text), public.apagar_recado(text, text) to anon;

   Para trocar a senha, mude 'admin123' nas duas funções acima (e rode de novo).
   ========================================================= */
const SUPABASE_URL = "https://utpddwluywrxyrpfuplc.supabase.co";
const SUPABASE_KEY = "sb_publishable_QSNQuySu4AsSvhLifP6SKA_oejVS05j";
const TABLE = "recados";

const db = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

const Store = {
  /* Todos os recados, do mais recente para o mais antigo */
  async list() {
    if (!db) throw new Error("SDK do Supabase não carregou");
    const { data, error } = await db.from(TABLE).select("id, created_at, nome, origem, mensagem")
      .order("created_at", { ascending: false }).limit(300);
    if (error) throw error;
    return data.map((r) => ({ id: r.id, name: r.nome || "", source: r.origem || "Outro", text: r.mensagem, createdAt: r.created_at }));
  },
  /* Salva um recado novo */
  async add(entry) {
    if (!db) throw new Error("SDK do Supabase não carregou");
    const { data, error } = await db.from(TABLE).insert({ nome: entry.name, origem: entry.source, mensagem: entry.text }).select("id").single();
    if (error) throw error;
    return { ...entry, id: data ? data.id : entry.id };
  },
  /* Admin: confere a senha e apaga, tudo validado no servidor */
  async checkAdmin(senha) {
    if (!db) throw new Error("SDK do Supabase não carregou");
    const { data, error } = await db.rpc("admin_ok", { p_senha: senha });
    if (error) throw error;
    return data === true;
  },
  async remove(id, senha) {
    const { data, error } = await db.rpc("apagar_recado", { p_id: String(id), p_senha: senha });
    if (error) throw error;
    return data === true;
  }
};

/* =========================================================
   2) UTILITÁRIOS
   ========================================================= */
const $ = (s) => document.querySelector(s);
const MAX = 280;
const fmtDate = (iso) => new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" }).replace(".", "");
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

/* =========================================================
   3) MURAL (textContent, nunca innerHTML para texto de usuário: evita injeção de HTML)
   ========================================================= */
let adminPass = null;   // fica só na memória da página; some ao recarregar
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';
const wall = $("#wall");

function showWallMsg(txt) {
  const p = document.createElement("p"); p.className = "wall-msg"; p.textContent = txt;
  wall.replaceChildren(p);
}

function addDelete(card, m) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "del"; b.setAttribute("aria-label", "Apagar recado"); b.innerHTML = TRASH;
  let armed = false, t;
  b.addEventListener("click", async () => {
    if (!armed) {                                   // 1º toque: pede confirmação
      armed = true; b.classList.add("armed");
      t = setTimeout(() => { armed = false; b.classList.remove("armed"); }, 3000);
      return;
    }
    clearTimeout(t); b.disabled = true;             // 2º toque: apaga no Supabase
    try {
      if (await Store.remove(m.id, adminPass)) { await renderMural(); toast("Recado apagado"); }
      else { toast("Senha de admin recusada"); b.disabled = false; }
    } catch (e) { console.error(e); toast("Não foi possível apagar"); b.disabled = false; }
  });
  card.append(b);
}

function buildCard(m, fresh) {
  const card = document.createElement("article");
  card.className = `note t-${m.source.replace(/\s+/g, "-")}${fresh ? " fresh" : ""}`;
  const p = document.createElement("p"); p.textContent = m.text;
  const foot = document.createElement("footer");
  const who = document.createElement("span");
  const anon = !m.name || !m.name.trim();
  who.className = "who" + (anon ? " anon" : ""); who.textContent = anon ? "Anônimo" : m.name;
  const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = m.source;
  const time = document.createElement("time"); time.dateTime = m.createdAt; time.textContent = fmtDate(m.createdAt);
  foot.append(who, tag, time);
  card.append(p, foot);
  if (adminPass) addDelete(card, m);
  return card;
}

async function renderMural(freshId) {
  let items;
  try { items = await Store.list(); }
  catch (e) { console.error(e); showWallMsg("Não deu para carregar o mural agora. Recarregue a página em instantes."); return; }
  $("#count").textContent = items.length;
  if (!items.length) { showWallMsg("Ainda não tem nenhum recado. Seja o primeiro a deixar sua marca."); return; }
  wall.replaceChildren(...items.map((m) => buildCard(m, m.id === freshId)));
}

/* =========================================================
   4) FORMULÁRIO
   Sem <form>: preview e iframes com sandbox bloqueiam o envio de formulários.
   ========================================================= */
const textEl = $("#text"), counterEl = $("#counter"), sendEl = $("#send"), btn = $("#submit"), label = $("#btn-label");

function updateCounter() {
  const n = textEl.value.length;
  counterEl.textContent = `${n} / ${MAX}`;
  counterEl.className = "counter" + (n >= MAX ? " max" : n >= MAX - 30 ? " warn" : "");
}
textEl.addEventListener("input", updateCounter);

/* Efeito de corte: um talho diagonal divide o botão em duas metades, que se afastam e voltam */
const cutEl = $("#cut");
function setLabel(txt) {
  label.textContent = txt;
  cutEl.querySelectorAll(".half").forEach((half) => (half.textContent = txt));
}
setLabel("Selar na Cápsula");

let busy = false;
async function send() {
  if (busy) return;
  const err = $("#error");
  err.textContent = "";
  const text = textEl.value.trim();
  if (text.length < 3) { err.textContent = "Escreva pelo menos uma frase para selar na cápsula."; textEl.focus(); return; }

  const entry = {
    id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()),
    name: $("#name").value.trim().slice(0, 40),
    source: document.querySelector('input[name="source"]:checked').value,
    text: text.slice(0, MAX),
    createdAt: new Date().toISOString()
  };

  busy = true; btn.disabled = true;
  sendEl.classList.add("cutting");                 // o corte começa ao apertar
  let ok = false;
  try {
    const [saved] = await Promise.all([Store.add(entry), wait(450)]);   // 450ms: as metades já estão afastadas
    setLabel("Selado na cápsula");
    toast("Sua marca foi selada na cápsula");
    $("#name").value = ""; textEl.value = ""; updateCounter();
    await renderMural(saved && saved.id);
    ok = true;
  } catch (e) {
    console.error(e);
    err.textContent = "Não deu para salvar agora. Tente de novo em instantes.";
  }
  await wait(700);                                  // termina de juntar as metades
  sendEl.classList.remove("cutting");
  if (ok) { sendEl.classList.add("done"); $("#mural").scrollIntoView({ behavior: "smooth" }); }
  await wait(1300);
  sendEl.classList.remove("done");
  setLabel("Selar na Cápsula");
  btn.disabled = false; busy = false;
}
btn.addEventListener("click", send);
$("#name").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); textEl.focus(); } });

/* Placeholder curto em telas estreitas (o campo não quebra linha) */
const nameEl = $("#name"), fullPh = nameEl.placeholder, mq = matchMedia("(max-width: 520px)");
const setPh = () => { nameEl.placeholder = mq.matches ? "nome/nick ou @ — vazio = anônimo" : fullPh; };
(mq.addEventListener ? mq.addEventListener("change", setPh) : mq.addListener(setPh)); setPh();

/* =========================================================
   5) MODO ADMIN SECRETO: clique 5 vezes seguidas no título
   ========================================================= */
const modal = $("#modal"), passEl = $("#pass"), passErr = $("#pass-err");
let titleClicks = 0, titleTimer;

function openModal() { passEl.value = ""; passErr.textContent = ""; modal.hidden = false; setTimeout(() => passEl.focus(), 30); }
function closeModal() { modal.hidden = true; }
function setAdmin(pass) {
  adminPass = pass;
  document.body.classList.toggle("is-admin", !!pass);
  $("#admin-bar").hidden = !pass;
  renderMural();
}

$("#titulo").addEventListener("click", () => {
  titleClicks++; clearTimeout(titleTimer);
  titleTimer = setTimeout(() => (titleClicks = 0), 1500);   // os cliques precisam ser seguidos
  if (titleClicks >= 5) { titleClicks = 0; if (!adminPass) openModal(); }
});

async function tryLogin() {
  const senha = passEl.value;
  if (!senha) return;
  passErr.textContent = "";
  try {
    if (await Store.checkAdmin(senha)) { closeModal(); setAdmin(senha); toast("Modo admin ativo"); }
    else passErr.textContent = "Senha incorreta.";
  } catch (e) {
    console.error(e);
    passErr.textContent = "Não consegui validar. Rode o SQL do arquivo no Supabase.";
  }
}
$("#pass-ok").addEventListener("click", tryLogin);
$("#pass-cancel").addEventListener("click", closeModal);
$("#logout").addEventListener("click", () => setAdmin(null));
passEl.addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal.hidden) closeModal(); });

updateCounter();
showWallMsg("Carregando recados…");
renderMural();
</script>
</body>
</html>
